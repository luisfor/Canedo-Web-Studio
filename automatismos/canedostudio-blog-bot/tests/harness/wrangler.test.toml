# Configuración aislada de pruebas locales de Cloudflare Workers AI
# Este archivo es EXCLUSIVAMENTE para pruebas locales con wrangler dev en 127.0.0.1.
# NUNCA desplegar ni utilizar en producción.

name = "canedo-visual-harness"
main = "worker.js"
